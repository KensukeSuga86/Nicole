<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nicole 0 解説エディタ</title><style>
:root{color-scheme:dark;--bg:#07111d;--panel:#0c1826;--line:#284761;--text:#dcecff;--muted:#7f9db4;--accent:#69d2ff;--ok:#70e1a2;--warn:#ffd06b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#06101b,#091522);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}header{height:52px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#091522;position:sticky;top:0;z-index:5}header b{font-size:15px}.spacer{flex:1}button,select,input,textarea{font:inherit;color:var(--text);background:#0a1420;border:1px solid #36546d;border-radius:7px;padding:7px 9px}button{cursor:pointer}button:hover{border-color:#65b8e7}.primary{border-color:#4aa1cc;background:#10283a}.danger{border-color:#7c4050;color:#ffc4cf}.wrap{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:calc(100vh - 52px)}aside{border-right:1px solid var(--line);padding:12px;overflow:auto}.main{padding:14px;overflow:auto}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:5px}.muted{color:var(--muted);font-size:11px}.list{display:flex;flex-direction:column;gap:4px;margin-top:10px}.item{width:100%;text-align:left;padding:7px 8px;background:#08131f}.item.active{border-color:var(--accent);background:#102638}.meta{font-size:11px;color:var(--muted)}.title{font-size:20px;margin:0 0 4px}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{border:1px solid #203e56;background:#091521;border-radius:9px;padding:10px}.field label{display:block;font-weight:700;color:#bfe8ff;margin-bottom:6px}.field textarea{width:100%;min-height:140px;resize:vertical;line-height:1.55}.field.full{grid-column:1/-1}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.status{padding:8px 10px;border-radius:8px;background:#0a1c20;border:1px solid #22504a;color:#aef3c7;font-size:12px}.search{width:100%;margin-top:8px}.badge{display:inline-block;border:1px solid #36546d;border-radius:999px;padding:2px 7px;font-size:10px;color:#abd8f1}@media(max-width:780px){.wrap{grid-template-columns:1fr}.editor-grid{grid-template-columns:1fr}.field.full{grid-column:auto}aside{border-right:0;border-bottom:1px solid var(--line);max-height:40vh}}</style></head><body>
<header><b>Nicole 0 — Nicole Astronomy Database 解説エディタ</b><span class="badge" id="dbVersion">DB</span><div class="spacer"></div><button id="exportPatch">編集差分を書き出し</button><button id="importPatch">差分を読み込み</button><input id="importFile" type="file" accept="application/json,.json" hidden><button id="resetAll" class="danger">全編集を消去</button></header>
<div class="wrap"><aside><div class="col"><label>種類</label><select id="kind"><option value="constellation">星座</option><option value="star">恒星</option><option value="dso">深宇宙天体</option><option value="planet">惑星</option></select><input id="search" class="search" type="search" placeholder="名称 / IDで検索"><div class="muted">編集内容はSafariのローカル保存領域へ保持されます。同一オリジンのNicole 2は再読込時にこの差分を反映します。</div></div><div class="list" id="list"></div></aside>
<main class="main"><h1 class="title" id="itemTitle">対象を選択</h1><div class="meta" id="itemMeta"></div><div class="toolbar"><button id="save" class="primary">この解説を保存</button><button id="resetItem">この天体だけ初期値へ戻す</button><button id="downloadData">この種類の編集済みJSONを書き出す</button></div><div class="status" id="status">データを読み込み中…</div><div id="fields" class="editor-grid" style="margin-top:12px"></div></main></div>
<script type="module" src="./description-editor.js"></script></body></html>
